# Single source of retrieval settings. Change one line here; scripts/build.py mirrors chunk_max/overlap.
embedding:
  model_name: google/embeddinggemma-300m   # confirmed by ML engineer 2026-11-14; gated (Gemma terms), runs offline after download
  model_version: 57c266a740f537b4dc058e1b0cda161fd15afa75   # Hugging Face revision sha, pin when loading
  library: sentence-transformers
  dimensions: 768          # verify against model card on first load
  query_prompt: "task: search result | query: "   # per model card; verify on first load
  document_prompt: "title: none | text: "
keyword:
  method: bm25
  k1: 1.2
  b: 0.75
chunking:
  strategy: by_section    # abstract / methods / results / conclusions; PSI objective / approach / hypothesis
  target_min_tokens: 300
  target_max_tokens: 600
  overlap_tokens: 50
  token_counter: whitespace_x1.3   # approximate until embedding tokenizer is confirmed
  keep_tables_whole: true
retrieval:
  top_k: 5
  hybrid_weight_bm25: 0.5
  hybrid_weight_embedding: 0.5
  min_cosine: 0.40         # chunks with no BM25 hit need this cosine to be returned; calibrate on eval off-topic set
llm:
  provider: groq
  base_url: https://api.groq.com/openai/v1
  model: llama-3.3-70b-versatile   # checked against Groq's /models list at run time
  temperature: 0
  max_tokens: 400
  context_chunks: 5
  context_runs: 8
  api_key_env: GROQ_API_KEY        # read from env or a local .env file; never committed, never shipped to the site
data:
  manifest: data/manifest.csv
  runs: data/runs.csv
  ranked_view: data/runs_ranked_view.csv
  chunks: data/chunks.jsonl
  atmosphere_targets: data/atmosphere_targets.csv
units:
  pressure: kPa
  spread_rate: mm/s
  flow: m/s
  o2: percent_by_volume
